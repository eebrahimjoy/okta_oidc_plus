name: okta_oidc_plus
description: A modern Flutter plugin for Okta OIDC authentication enabling secure user login, token management, and identity integration using OpenID Connect with Okta services.
version: 1.0.2
homepage: https://eebrahimjoy.com
repository: https://github.com/eebrahimjoy/okta_oidc_plus
issue_tracker: https://github.com/eebrahimjoy/okta_oidc_plus/issues

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.1.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.okta.okta_oidc_plus
        pluginClass: OktaOidcPlusPlugin
      ios:
        pluginClass: OktaOidcPlusPlugin

